title: Sandeep S J
description: Things I built, and things I found out while building them.
author: Sandeep S J
url: https://sandeepsj.github.io
baseurl: /blog
permalink: /:year/:month/:day/:title/
timezone: Asia/Kolkata
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
feed:
  path: feed.xml
exclude:
  - README.md
  - plugin
  - .claude-plugin
  - Gemfile
  - Gemfile.lock
