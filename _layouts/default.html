<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e8efdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161d17" media="(prefers-color-scheme: dark)">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip" href="#content">Skip to the writing</a>
  <header class="strip">
    <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Site">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
    </nav>
  </header>
  <main id="content" class="sheet">{{ content }}</main>
  <footer class="foot sheet">
    <p>{{ site.author }}, {{ 'now' | date: '%Y' }}. Written by hand, built by GitHub Pages. <a href="https://github.com/sandeepsj/blog">Source</a>.</p>
  </footer>
</body>
</html>
