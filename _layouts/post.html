---
layout: default
---
<article class="post">
  <header>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>{% if page.tags.size > 0 %} · {{ page.tags | join: ' · ' }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="body">{{ content }}</div>
</article>
